app-id: io.github.makoni.SwiftAdwaitaDemo
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6
command: DemoApp

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/swift6/bin
  prepend-ld-library-path: /usr/lib/sdk/swift6/lib

modules:
  - name: DemoApp
    buildsystem: simple
    sources:
      - type: dir
        path: ..
    build-commands:
      - swift build -c release --product DemoApp --static-swift-stdlib
      - install -Dm755 .build/release/DemoApp /app/bin/DemoApp
      - install -Dm644 flatpak/io.github.makoni.SwiftAdwaitaDemo.desktop /app/share/applications/io.github.makoni.SwiftAdwaitaDemo.desktop
      - install -Dm644 flatpak/io.github.makoni.SwiftAdwaitaDemo.metainfo.xml /app/share/metainfo/io.github.makoni.SwiftAdwaitaDemo.metainfo.xml
      - install -Dm644 flatpak/io.github.makoni.SwiftAdwaitaDemo.svg /app/share/icons/hicolor/scalable/apps/io.github.makoni.SwiftAdwaitaDemo.svg
