name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test with Swift ${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3"]
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libadwaita-1-dev libgtksourceview-5-dev xvfb

      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: xvfb-run swift test --no-parallel --enable-code-coverage

      - name: Generate coverage report
        if: matrix.swift == '6.3'
        run: |
          BIN=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name default.profdata -type f | head -1)
          TEST_BIN="$BIN/swift-adwaitaPackageTests.xctest"
          llvm-cov report \
            -instr-profile "$PROFDATA" \
            "$TEST_BIN" \
            -ignore-filename-regex=".build|Tests|DemoApp"

  build-macos:
    name: Build on macOS
    runs-on: macos-26
    # Verifies the package compiles against the Homebrew GTK4 / libadwaita
    # stack on Apple Silicon. Tests are NOT run in CI: GitHub-hosted macOS
    # runners are headless (no WindowServer session), and GTK4-Quartz
    # registers Cocoa runloop observers at `gtk_init` time that corrupt the
    # autorelease pool on subsequent test methods in a headless process.
    # The same XCTest mirror suite passes 1181/1181 locally in a normal
    # GUI session — see CONTRIBUTING.md for the local invocation.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # macos-26's default Xcode is 26.2 (Swift 6.2). Pick 26.4.1 to match
      # what swift-tools-version: 6.2 needs and what local devs typically use.
      - name: Select Xcode 26.4.1 (Swift 6.3)
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Install GTK stack via Homebrew
        run: brew install libadwaita gtksourceview5 pkgconf

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Build test bundle
        # Compile-only — exercises the XCTest mirror sources and catches
        # Swift type errors without trying to execute the suite headlessly.
        run: swift build --build-tests

  lint:
    name: SwiftFormat Lint
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache SwiftFormat
        id: cache-swiftformat
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/swiftformat
          key: swiftformat-0.60.1-swift6.3

      - name: Install SwiftFormat
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.60.1 https://github.com/nicklockwood/SwiftFormat.git /tmp/SwiftFormat
          cd /tmp/SwiftFormat && swift build -c release
          cp /tmp/SwiftFormat/.build/release/swiftformat /usr/local/bin/

      - name: Check formatting
        run: swiftformat --lint Sources/ Tests/

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libadwaita-1-dev libgtksourceview-5-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build documentation
        run: |
          swift package generate-documentation --target Adwaita --disable-indexing 2>&1 | tail -5
