name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test with Swift ${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "6.2", "6.3"]
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libadwaita-1-dev xvfb

      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: xvfb-run swift test --enable-code-coverage

      - name: Generate coverage report
        if: matrix.swift == '6.3'
        run: |
          BIN=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name default.profdata -type f | head -1)
          TEST_BIN="$BIN/swift-adwaitaPackageTests.xctest"
          llvm-cov report \
            -instr-profile "$PROFDATA" \
            "$TEST_BIN" \
            -ignore-filename-regex=".build|Tests|DemoApp"

  lint:
    name: SwiftFormat Lint
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache SwiftFormat
        id: cache-swiftformat
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/swiftformat
          key: swiftformat-0.60.1-swift6.3

      - name: Install SwiftFormat
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.60.1 https://github.com/nicklockwood/SwiftFormat.git /tmp/SwiftFormat
          cd /tmp/SwiftFormat && swift build -c release
          cp /tmp/SwiftFormat/.build/release/swiftformat /usr/local/bin/

      - name: Check formatting
        run: swiftformat --lint Sources/ Tests/

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libadwaita-1-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build documentation
        run: |
          swift package generate-documentation --target Adwaita --disable-indexing 2>&1 | tail -5
