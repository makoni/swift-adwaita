name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libadwaita-1-dev

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
