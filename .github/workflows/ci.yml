name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test with Swift ${{ matrix.swift }}
    strategy:
      matrix:
        swift: ["6.1", "6.2", "6.3"]
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libadwaita-1-dev xvfb

      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: xvfb-run swift test
