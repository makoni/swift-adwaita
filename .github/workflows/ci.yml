name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test with Swift ${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "6.2", "6.3"]
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libadwaita-1-dev xvfb

      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: xvfb-run swift test --enable-code-coverage

      - name: Generate coverage report
        if: matrix.swift == '6.3'
        run: |
          BIN=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name default.profdata -type f | head -1)
          TEST_BIN="$BIN/swift-adwaitaPackageTests.xctest"
          llvm-cov report \
            -instr-profile "$PROFDATA" \
            "$TEST_BIN" \
            -ignore-filename-regex=".build|Tests|DemoApp"

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libadwaita-1-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build documentation
        run: |
          swift package generate-documentation --target Adwaita --disable-indexing 2>&1 | tail -5
