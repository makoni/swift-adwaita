name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install system dependencies
        run: dnf install -y libadwaita-devel xorg-x11-server-Xvfb git

      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Build
        run: swift build

      - name: Run tests
        run: xvfb-run swift test
